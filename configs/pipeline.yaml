detector:
  model: yolo # yolo or rfdetr
  confidence: 0.10

  yolo:
    weights: outputs/training/yolo-penn-fudan/weights/best.pt
    image_size: 640
    device: 0

  rfdetr:
    weights: outputs/training/rfdetr-penn-fudan/checkpoint_best_total.pth

video:
  source: 0

tracking:
  enabled: true
  tracker: bytetrack
  frame_rate: 30
  track_activation_threshold: 0.25
  lost_track_buffer: 30
  minimum_matching_threshold: 0.8

zones:
  enabled: true
  config_path: configs/zones.json

events:
  output_path: outputs/events/intrusions.jsonl
