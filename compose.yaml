services:
  analytics:
    build:
      context: .
      dockerfile: Dockerfile.gpu

    image: intelligent-video-analytics:gpu

    gpus: all

    working_dir: /app

    environment:
      PYTHONPATH: /app/src
      PYTHONUNBUFFERED: "1"

    volumes:
      - ./inputs:/app/inputs:ro
      - ./outputs:/app/outputs
      - ./configs:/app/configs:ro

    command:
      - python
      - scripts/run_headless.py
      - --source
      - ${ANALYTICS_SOURCE:-/app/inputs/test_video.mp4}
      - --model
      - ${ANALYTICS_MODEL:-yolo}
      - --events
      - /app/outputs/events/${ANALYTICS_MODEL:-yolo}-compose.jsonl
      - --summary
      - /app/outputs/headless/${ANALYTICS_MODEL:-yolo}-compose-summary.json

    restart: "no"
