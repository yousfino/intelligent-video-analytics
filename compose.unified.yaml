services:
  api:
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      ANALYTICS_MAX_FRAME_AGE_SECONDS: "15"
      ANALYTICS_RECONNECT_DELAY_SECONDS: "${ANALYTICS_RECONNECT_DELAY_SECONDS:-3}"
      ANALYTICS_MAX_RECONNECT_ATTEMPTS: "${ANALYTICS_MAX_RECONNECT_ATTEMPTS:-0}"

    depends_on:
      postgres:
        condition: service_healthy

    stop_grace_period: 45s

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=10)"
      interval: 15s
      timeout: 12s
      retries: 5
      start_period: 90s

  prometheus:
    volumes:
      - ./monitoring/prometheus.docker.yml:/etc/prometheus/prometheus.yml:ro

    depends_on:
      api:
        condition: service_healthy

  grafana:
    depends_on:
      prometheus:
        condition: service_healthy
