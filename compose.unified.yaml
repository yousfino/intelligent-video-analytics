services:
  api:
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  prometheus:
    volumes:
      - ./monitoring/prometheus.docker.yml:/etc/prometheus/prometheus.yml:ro

    depends_on:
      api:
        condition: service_healthy

  grafana:
    depends_on:
      prometheus:
        condition: service_healthy
